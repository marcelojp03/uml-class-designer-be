services:
  postgres:
    image: postgres:17-alpine
    container_name: uml-class-designer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uml_designer
      POSTGRES_USER: uml_designer
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uml_designer -d uml_designer"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - uml_designer_postgres_data:/var/lib/postgresql/data

volumes:
  uml_designer_postgres_data:
